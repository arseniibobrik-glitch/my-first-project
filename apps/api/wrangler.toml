name = "my-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "development"

# D1 Database (SQLite на edge)
# Создай: wrangler d1 create my-db
# Затем раскомментируй и укажи database_id:
# [[d1_databases]]
# binding = "DB"
# database_name = "my-db"
# database_id = "your-database-id-here"

# KV Namespace (для кэша/сессий)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

[observability]
enabled = true